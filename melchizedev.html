<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESTRICTED ACCESS // DIMITRI_VAULT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Container Terminal */
    .terminal-box {
      width: 100%;
      max-width: 800px;
      background: rgba(10, 15, 10, 0.95);
      border: 1px solid #00ff41;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0, 255, 65, 0.2);
      overflow: hidden;
    }

    /* Header Bar Terminal */
    .terminal-header {
      background: #002200;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00ff41;
    }

    .terminal-title {
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: #88ff88;
    }

    .status-badge {
      font-size: 0.75rem;
      background: #ff0000;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: bold;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    /* Body Terminal */
    .terminal-body {
      padding: 25px;
      font-size: 1.05rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* Efek Kursor Mengetik */
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.1rem;
      background-color: #00ff41;
      vertical-align: middle;
      animation: cursor-blink 0.8s infinite;
    }

    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Highlight Kode */
    .cipher-code {
      color: #ffff00;
      font-weight: bold;
      background: rgba(255, 255, 0, 0.1);
      padding: 10px;
      border-left: 3px solid #ffff00;
      margin: 15px 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="terminal-box">
    <div class="terminal-header">
      <span class="terminal-title">SYSTEM_LOG</span>
      <span class="status-badge">LIVE</span>
    </div>
    <div class="terminal-body">
      <span id="typewriter-text"></span><span class="cursor"></span>
    </div>
  </div>

  <script>
    // Teks yang akan diketik otomatis oleh sistem
    const fullText = 
`==================================================
   SECURE TERMINAL ACCESS // DIMITRI MELCHIZEDEV
==================================================
[+] CONNECTING TO PROXY NETWORK... OK
[+] BYPASSING BSSN FIREWALL... OK
[+] RETRIEVING ENCRYPTED PAYLOAD... COMPLETED

Selamat, Tim Penyelidik. 
Jika kalian membaca pesan ini, berarti kalian berhasil memecahkan enkripsi Base64 di papan tulis St. Regis.

Namun, pencarian masih belum selesai.

[25] - [ 5 ] - [11] - [18] - [88] - [18]
01010011 01100001 01101001 01100100 01100001 01101000

carilah dimana garis vertikal tidak lagi terlihat jujur
==================================================`;

    const speed = 25; // Kecepatan ketik (milidetik per karakter)
    let i = 0;
    const target = document.getElementById("typewriter-text");

    function typeWriter() {
      if (i < fullText.length) {
        target.textContent += fullText.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      }
    }

    // Jalankan efek mengetik saat halaman selesai dimuat
    window.onload = typeWriter;
  </script>

</body>
</html>
